version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s | %(levelname)s | %(name)s | %(message)s"

handlers:
  file:
    class: logging.handlers.RotatingFileHandler
    formatter: standard
    filename: /home/antoniohazman8855/Ecommerce-Project/Adaptive Algorithm/logs/app.log
    maxBytes: 10485760
    backupCount: 5
    level: INFO

  console:
    class: logging.StreamHandler
    formatter: standard
    level: INFO

root:
  level: INFO
  handlers: [file, console]

loggers:
  uvicorn:
    level: INFO
    propagate: true
  uvicorn.error:
    level: INFO
    propagate: true
  uvicorn.access:
    level: INFO
    propagate: true
