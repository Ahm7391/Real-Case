<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="globeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>
  <!-- Globe background sphere -->
  <circle cx="16" cy="16" r="14" fill="url(#globeGrad)" />
  
  <!-- Outer border -->
  <circle cx="16" cy="16" r="14" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-opacity="0.9" />
  
  <!-- Central Vertical Meridian -->
  <line x1="16" y1="2" x2="16" y2="30" stroke="#ffffff" stroke-width="1.4" stroke-opacity="0.85" stroke-linecap="round" />
  
  <!-- Equator -->
  <line x1="2" y1="16" x2="30" y2="16" stroke="#ffffff" stroke-width="1.4" stroke-opacity="0.85" stroke-linecap="round" />
  
  <!-- Longitudinal Curved Lines (Meridians) -->
  <ellipse cx="16" cy="16" rx="7.5" ry="14" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-opacity="0.85" />
  
  <!-- Latitudinal Curved Lines (Parallels) -->
  <path d="M 4 10 Q 16 14 28 10" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.75" />
  <path d="M 4 22 Q 16 18 28 22" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.75" />
</svg>
